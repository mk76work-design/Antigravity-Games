<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Climber — ゲキムズ物理絵文字アクション</title>
    <meta name="description" content="Getting Over It × Jump King。絵文字キャラが物理法則と戦いながら頂上を目指す激ムズプラットフォーマー。">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="game-wrapper">
        <h1 class="game-title">EMOJI CLIMBER</h1>
        <p class="game-subtitle">🥺 ← この子を頂上まで連れて行け</p>
        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
        </div>
        <div class="controls-hint">
            <span>←→ 移動</span>
            <span>Space 長押し → 離す でジャンプ</span>
            <span>方向キー + Space で斜めジャンプ</span>
        </div>
    </div>
    <script type="module" src="main.js"></script>

</html>
