<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ウォーターバルーンテトリス</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;700&display=swap" rel="stylesheet">
</head>
<body>
    <h1>WATER BALLOON TETRIS</h1>
    
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div class="stat-box">
                <div class="stat-label">SCORE</div>
                <div id="score" class="stat-value">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">LINES</div>
                <div id="lines" class="stat-value">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">WATER</div>
                <div id="water-level" class="stat-value">0%</div>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
